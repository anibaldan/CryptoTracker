<script>
(function(){
  try {
    var t = localStorage.getItem('cryptotrack-theme');
    if (t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  } catch (e) {}
})();
</script>
<style id="cryptotrack-theme-toggle-css">
  #ct-theme-toggle {
    position: fixed;
    bottom: 1.15rem;
    right: 1.15rem;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid hsl(var(--border));
    background: hsl(var(--card));
    color: hsl(var(--foreground));
    box-shadow: 0 8px 24px #42332422;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .18s, background-color .18s, border-color .18s;
  }
  #ct-theme-toggle:hover { transform: translateY(-1px); }
  #ct-theme-toggle:active { transform: translateY(0); }
  #ct-theme-toggle svg { width: 18px; height: 18px; display: none; }
  html:not(.dark) #ct-theme-toggle .icon-moon { display: block; }
  html.dark #ct-theme-toggle .icon-sun { display: block; }
  #ct-theme-toggle:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px hsl(var(--ring) / .25);
  }
  @media (max-width: 767px) {
    #ct-theme-toggle { bottom: 1rem; right: 1rem; }
  }
</style>

<button type="button" id="ct-theme-toggle" title="Cambiar tema" aria-label="Cambiar entre tema claro y oscuro" data-testid="button-theme-toggle">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
  </svg>
</button>
<script>
(function () {
  var KEY = 'cryptotrack-theme';
  var root = document.documentElement;

  function getPreferred() {
    try {
      var stored = localStorage.getItem(KEY);
      if (stored === 'dark' || stored === 'light') return stored;
    } catch (e) {}
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    return 'light';
  }

  function apply(theme) {
    if (theme === 'dark') root.classList.add('dark');
    else root.classList.remove('dark');
    try { localStorage.setItem(KEY, theme); } catch (e) {}
    var btn = document.getElementById('ct-theme-toggle');
    if (btn) {
      btn.title = theme === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
      btn.setAttribute('aria-label', btn.title);
      btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }
  }

  function toggle() {
    apply(root.classList.contains('dark') ? 'light' : 'dark');
  }

  // Apply again in case React or other scripts touched the class
  apply(getPreferred());

  function bind() {
    var btn = document.getElementById('ct-theme-toggle');
    if (!btn || btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', toggle);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }

  // Follow OS changes only when user has not chosen explicitly
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function (e) {
      try {
        if (localStorage.getItem(KEY) === 'dark' || localStorage.getItem(KEY) === 'light') return;
      } catch (err) {}
      apply(e.matches ? 'dark' : 'light');
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch (e) {}
})();
</script>
